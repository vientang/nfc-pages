<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Purry Friends On A Lake</title>
  <meta name="description" content="Two cats who like to swim by Nguyen Tang">
  <style>
    :root {
      --bg: #edf2f3;
      --ink: #17262e;
      --muted: #55676f;
      --ripple: #7fa3b0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1a21;
        --ink: #e7eff2;
        --muted: #9db0b8;
        --ripple: #4f7686;
      }
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      display: flex;
      align-items: center;
      padding: 2rem 1.75rem;
      padding-top: max(2rem, env(safe-area-inset-top));
      padding-bottom: max(2rem, env(safe-area-inset-bottom));
      -webkit-text-size-adjust: 100%;
    }

    main {
      width: 100%;
      max-width: 34rem;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 9vw, 3.5rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.01em;
      text-wrap: balance;
    }

    .ripple {
      display: block;
      width: 100%;
      max-width: 15rem;
      height: 0.9rem;
      margin: 1.5rem 0 1.25rem;
      color: var(--ripple);
    }

    p {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 400;
      line-height: 1.55;
      color: var(--muted);
      max-width: 30rem;
    }

    /* One gentle moment on load: the ripple draws itself once. */
    .ripple path {
      stroke-dasharray: 320;
      stroke-dashoffset: 320;
      animation: draw 1.6s ease-out 0.2s forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .ripple path { animation: none; stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Purry Friends On A Lake</h1>

    <svg class="ripple" viewBox="0 0 240 14" fill="none" aria-hidden="true">
      <path d="M2 7 C 14 1, 26 13, 38 7 S 62 1, 74 7 S 98 13, 110 7 S 134 1, 146 7 S 170 13, 182 7 S 206 1, 218 7 S 232 11, 238 7"
            stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>

    <p>Two cats who like to swim by Nguyen Tang</p>
  </main>
</body>
</html>
